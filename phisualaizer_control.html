<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--f:'Barlow Condensed','Barlow',sans-serif;}
#wrap{width:100%;max-width:1200px;margin:0 auto;background:#000a1b;border-radius:12px;overflow:hidden;}
body{background:#000509;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:0;}
#container{width:100%;max-width:1200px;}
#c{width:100%;height:460px;display:block;}
#ui{padding:6px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:rgba(0,5,15,0.97);border-bottom:0.5px solid rgba(255,255,255,0.07);}
#logo{font-family:var(--f);font-size:16px;font-weight:600;color:#fff;letter-spacing:6px;flex-shrink:0;}
.btn{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.14);color:#888;border-radius:4px;padding:3px 10px;font-size:10px;font-weight:500;cursor:pointer;font-family:var(--f);letter-spacing:1px;transition:all 0.15s;flex-shrink:0;}
.btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
.btn.on{border-color:rgba(255,255,255,0.5);color:#fff;}
#panel{background:rgba(0,4,12,0.98);overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:820px;}
th{font-size:8.5px;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,0.28);font-family:var(--f);padding:5px 5px 4px;text-align:center;border-bottom:0.5px solid rgba(255,255,255,0.08);text-transform:uppercase;}
th.lh{text-align:left;padding-left:10px;}
td{padding:3px 4px;text-align:center;border-bottom:0.5px solid rgba(255,255,255,0.04);}
td.lc{text-align:left;padding-left:10px;}
.lname{font-size:11px;font-family:var(--f);font-weight:600;letter-spacing:1px;white-space:nowrap;}
.tbtn{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);color:#666;border-radius:3px;padding:2px 6px;font-size:9px;font-weight:600;letter-spacing:1px;cursor:pointer;font-family:var(--f);transition:all 0.12s;text-transform:uppercase;}
.tbtn:hover{background:rgba(255,255,255,0.13);color:#ccc;}
.tbtn.on{color:#fff;border-color:rgba(255,255,255,0.45);}
.pslider{width:64px;height:2px;cursor:pointer;vertical-align:middle;}
.pval{font-size:8.5px;color:rgba(255,255,255,0.35);font-family:var(--f);width:22px;display:inline-block;text-align:right;}
select.syncsel{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);color:#888;border-radius:3px;padding:2px 3px;font-size:8.5px;font-family:var(--f);cursor:pointer;outline:none;}
select.syncsel option{background:#000a1b;}
.psep{border-top:1px solid rgba(255,255,255,0.1);}
/* Audio */
#audiobar{background:rgba(0,3,10,0.99);border-top:0.5px solid rgba(255,255,255,0.08);padding:7px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#dropzone{border:1px dashed rgba(255,255,255,0.18);border-radius:6px;padding:5px 14px;font-family:var(--f);font-size:10px;color:rgba(255,255,255,0.35);cursor:pointer;transition:all 0.2s;flex-shrink:0;letter-spacing:1px;}
#dropzone:hover,#dropzone.over{border-color:rgba(255,255,255,0.5);color:#fff;background:rgba(255,255,255,0.04);}
#dropzone.loaded{border-color:rgba(100,255,150,0.5);color:#88ffaa;}
#fileinput{display:none;}
#trackname{font-family:var(--f);font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:0.5px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
#seekbar{flex:1;min-width:80px;height:2px;cursor:pointer;accent-color:#fff;}
#timecode{font-family:var(--f);font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:1px;white-space:nowrap;}
#vubars{display:flex;align-items:flex-end;gap:1px;height:18px;flex-shrink:0;}
.vubar{width:3px;background:rgba(255,255,255,0.15);border-radius:1px;transition:height 0.05s;}
#audlink{font-family:var(--f);font-size:9px;color:rgba(100,200,255,0.5);letter-spacing:1px;white-space:nowrap;}
</style>

<div id="container"><div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <span id="logo">PHISUALAIZER</span>
    <span style="font-family:var(--f);font-size:9px;color:rgba(100,255,150,0.5);letter-spacing:2px;" id="bcstatus">● PHISUALAIZER v1.0</span>
    <button class="btn on" id="bL1" onclick="tog('L1')" style="border-color:#ff6633">L1 CEILING</button>
    <button class="btn on" id="bL2" onclick="tog('L2')" style="border-color:#ff88cc">L2 WALL-HI</button>
    <button class="btn on" id="bL3" onclick="tog('L3')" style="border-color:#ffee44">L3 FLOOR</button>
    <button class="btn" id="bL4" onclick="tog('L4')" style="border-color:#44aaff">L4 LEFT</button>
    <button class="btn" id="bL5" onclick="tog('L5')" style="border-color:#44aaff">L5 RIGHT</button>

  </div>
  <div id="panel">
    <!-- ライトパネル -->
    <table>
      <thead>
        <tr>
          <th class="lh">LIGHT</th>
          <th>ON</th>
          <th>LENGTH</th>
          <th>SPEED<br><button class="tbtn" style="margin-top:2px" onclick="syncAll('spd')">SYNC</button></th>
          <th>SPREAD<br><button class="tbtn" style="margin-top:2px" onclick="syncAll('br')">SYNC</button></th>
          <th>HUE<br><button class="tbtn" style="margin-top:2px" onclick="syncAll('hue')">SYNC</button></th>
          <th>BRIGHT<br><button class="tbtn" style="margin-top:2px" onclick="syncAll('bright')">SYNC</button></th>
          <th>BLINK<br><button class="tbtn" style="margin-top:2px" onclick="syncAll('blink')">SYNC</button></th>
          <th>SYNC TO</th>
          <th>GROUP</th>
          <th>AUTO</th>
        </tr>
      </thead>
      <tbody id="ptable"></tbody>
    </table>
    <!-- パーティクルパネル -->
    <table class="psep">
      <thead>
        <tr>
          <th class="lh">PARTICLE</th>
          <th>ON</th>
          <th>COUNT</th>
          <th>SPEED</th>
          <th>SIZE</th>
          <th>SPREAD</th>
          <th>BRIGHT</th>
          <th colspan="3"></th>
        </tr>
      </thead>
      <tbody id="pxtable"></tbody>
    </table>
  </div>
  <!-- Audio Bar -->
  <div id="audiobar">
    <div id="dropzone" onclick="document.getElementById('fileinput').click()"
      ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')"
      ondrop="event.preventDefault();this.classList.remove('over');loadAudioFile(event.dataTransfer.files[0])">
      ▶ DROP / SELECT
    </div>
    <input type="file" id="fileinput" accept="audio/*" onchange="loadAudioFile(this.files[0])">
    <button class="btn" id="bplay" onclick="togglePlay()" disabled>PLAY</button>
    <span id="trackname">— no file —</span>
    <input type="range" id="seekbar" min="0" max="100" value="0" step="0.1" oninput="seekAudio(this.value)" disabled>
    <span id="timecode">0:00 / 0:00</span>
    <div id="vubars"></div>
    <span style="font-family:var(--f);font-size:9px;color:rgba(255,255,255,0.28);letter-spacing:1px;">VOL</span>
    <input type="range" id="volslider" min="0" max="1" step="0.01" value="0.8" style="width:70px;height:2px;cursor:pointer;accent-color:#fff;" oninput="setVolume(this.value);document.getElementById('volvал').textContent=Math.round(this.value*100)">
    <span id="volvал" style="font-family:var(--f);font-size:9px;color:rgba(255,255,255,0.3);width:22px;display:inline-block;">80</span>
    <span id="audlink">WAV / MP3</span>
  </div>
</div>

<style>
#cambar{background:rgba(0,3,10,0.99);border-top:0.5px solid rgba(255,255,255,0.06);padding:6px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.cam-row{display:flex;align-items:center;gap:4px;}
.cam-lbl{font-family:var(--f);font-size:9px;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,0.28);text-transform:uppercase;white-space:nowrap;}
.cam-slider{width:90px;height:2px;cursor:pointer;accent-color:#fff;}
.cam-val{font-family:var(--f);font-size:9px;color:rgba(255,255,255,0.3);width:28px;display:inline-block;text-align:right;}
</style>

<div id="cambar">
  <span style="font-family:var(--f);font-size:10px;font-weight:600;letter-spacing:3px;color:rgba(255,255,255,0.4);">CAM</span>
  <div class="cam-row">
    <span class="cam-lbl">ORBIT</span>
    <input class="cam-slider" type="range" min="-180" max="180" step="1" value="0"
      oninput="CAM.orbit=+this.value;updateCamera();document.getElementById('vorbit').textContent=this.value+'°'">
    <span class="cam-val" id="vorbit">0°</span>
  </div>
  <div class="cam-row">
    <span class="cam-lbl">DIST</span>
    <input class="cam-slider" type="range" min="4" max="40" step="0.5" value="14"
      oninput="CAM.dist=+this.value;updateCamera();document.getElementById('vdist').textContent=(+this.value).toFixed(1)">
    <span class="cam-val" id="vdist">14.0</span>
  </div>
  <div class="cam-row">
    <span class="cam-lbl">HEIGHT</span>
    <input class="cam-slider" type="range" min="-8" max="16" step="0.5" value="0"
      oninput="CAM.height=+this.value;updateCamera();document.getElementById('vheight').textContent=(+this.value).toFixed(1)">
    <span class="cam-val" id="vheight">0.0</span>
  </div>
  <div class="cam-row">
    <span class="cam-lbl">FOV</span>
    <input class="cam-slider" type="range" min="30" max="110" step="1" value="65"
      oninput="CAM.fov=+this.value;updateCamera();document.getElementById('vfov').textContent=this.value+'°'">
    <span class="cam-val" id="vfov">65°</span>
  </div>
  <button class="btn" onclick="resetCamera()">RESET</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(canvas.offsetWidth||680,460);
renderer.setClearColor(0x000a1b,1);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000a1b,0.009);
const camera=new THREE.PerspectiveCamera(65,(canvas.offsetWidth||680)/460,0.1,200);
camera.position.set(0,0,14);
camera.lookAt(0,2,0);

// リサイズ対応
function onResize(){
  const w=canvas.offsetWidth;
  const h=Math.round(w*(460/680));
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);
onResize();

// カメラコントロール
const CAM={orbit:0, dist:14, height:0, fov:65};
function updateCamera(){
  const rad=CAM.orbit*(Math.PI/180);
  camera.position.set(
    Math.sin(rad)*CAM.dist,
    CAM.height,
    Math.cos(rad)*CAM.dist
  );
  camera.lookAt(0,2,0);
  camera.fov=CAM.fov;
  camera.updateProjectionMatrix();
}
function resetCamera(){
  CAM.orbit=0;CAM.dist=14;CAM.height=0;CAM.fov=65;
  updateCamera();
  // スライダーリセット
  document.querySelector('#cambar input[oninput*="orbit"]').value=0;
  document.querySelector('#cambar input[oninput*="dist"]').value=14;
  document.querySelector('#cambar input[oninput*="height"]').value=0;
  document.querySelector('#cambar input[oninput*="fov"]').value=65;
  document.getElementById('vorbit').textContent='0°';
  document.getElementById('vdist').textContent='14.0';
  document.getElementById('vheight').textContent='0.0';
  document.getElementById('vfov').textContent='65°';
}

let slow=false,stop=true;
const lOn={L1:true,L2:true,L3:true,L4:false,L5:false,L6:false};
function tog(k){lOn[k]=!lOn[k];document.getElementById('b'+k).classList.toggle('on',lOn[k]);document.getElementById('ton'+k).classList.toggle('on',lOn[k]);}
function togSlow(){slow=!slow;document.getElementById('bsl').classList.toggle('on',slow);}
function togStop(){stop=!stop;document.getElementById('bst').classList.toggle('on',stop);}

const LP={
  L1:{len:12,spd:0.006,br:1.0,hue:210,bright:1.0,blink:0,sync:'NONE',syncGroup:0,auto:false,_autoT:0},
  L2:{len:12,spd:0.005,br:1.0,hue:220,bright:1.0,blink:0,sync:'NONE',syncGroup:0,auto:false,_autoT:0},
  L3:{len:14,spd:0.007,br:1.0,hue:200,bright:1.0,blink:0,sync:'NONE',syncGroup:0,auto:false,_autoT:0},
  L4:{len:12,spd:0.004,br:1.0,hue:230,bright:1.0,blink:0,sync:'NONE',syncGroup:0,auto:false,_autoT:0},
  L5:{len:12,spd:0.004,br:1.0,hue:240,bright:1.0,blink:0,sync:'NONE',syncGroup:0,auto:false,_autoT:0},
  L6:{len:14,spd:0.008,br:1.2,hue:195,bright:1.2,blink:0,sync:'NONE',syncGroup:0,auto:false,_autoT:0},
};
const AUTO_TARGET={};
Object.keys(LP).forEach(k=>{AUTO_TARGET[k]={...LP[k]};});

const LIGHT_DEFS={
  L1:{pos:[0,10,0], beamLen:12,label:'L1 CEILING',count:6,spread:10,initRot:[0,0,0],sweepAxes:'xz',upward:false},
  L2:{pos:[0,4,0],  beamLen:12,label:'L2 WALL-HI',count:6,spread:10,initRot:[0,0,0],sweepAxes:'xy',upward:false},
  L3:{pos:[0,-7,0], beamLen:14,label:'L3 FLOOR',  count:6,spread:10,initRot:[0,0,0],sweepAxes:'xy',upward:true},
  L4:{pos:[-10,2,0],beamLen:12,label:'L4 LEFT',   count:3,spread:6, initRot:[0,0,0],sweepAxes:'yz',upward:false,sideRight:true},
  L5:{pos:[10,2,0], beamLen:12,label:'L5 RIGHT',  count:3,spread:6, initRot:[0,0,0],sweepAxes:'yz',upward:false,sideLeft:true},
  L6:{pos:[0,7,-6], beamLen:14,label:'L6 MV',     count:2,spread:5, initRot:[0,0,0],sweepAxes:'xy',upward:false,forward:true},
};
const COLORS={L1:'#ff6633',L2:'#ff88cc',L3:'#ffee44',L4:'#44aaff',L5:'#44aaff',L6:'#44ff88'};
const KEYS=Object.keys(LP);

// ===== パーティクル定義 =====
const PX_DEFS=[
  {id:'FLURRY', color:'#aaddff', label:'✦ FLURRY', count:200, spd:0.6,  size:0.06, spread:12, bright:0.55, on:true},
  {id:'SPARKS', color:'#ffcc44', label:'✦ SPARKS', count:120, spd:1.2,  size:0.05, spread:10, bright:0.7,  on:false},
  {id:'RAIN',   color:'#88ccff', label:'✦ RAIN',   count:150, spd:0.8,  size:0.04, spread:14, bright:0.45, on:false},
  {id:'ORBIT',  color:'#ff88ff', label:'✦ ORBIT',  count:100, spd:0.5,  size:0.07, spread:8,  bright:0.6,  on:false},
  {id:'BURST',  color:'#ffaa44', label:'✦ BURST',  count:80,  spd:1.5,  size:0.08, spread:6,  bright:0.8,  on:false},
  {id:'DRIFT',  color:'#aaffcc', label:'✦ DRIFT',  count:180, spd:0.3,  size:0.09, spread:16, bright:0.35, on:false},
];
const pxMeshes={};   // id→THREE.Points
const pxData={};     // id→[]

// パーティクルUI生成
const pxtbody=document.getElementById('pxtable');
PX_DEFS.forEach(def=>{
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td class="lc"><span class="lname" style="color:${def.color}">${def.label}</span></td>
    <td><button class="tbtn${def.on?' on':''}" id="pxon${def.id}" onclick="togPX('${def.id}')">${def.on?'ON':'OFF'}</button></td>
    <td><input class="pslider" type="range" min="20" max="600" step="10" value="${def.count}"
      oninput="getPX('${def.id}').count=+this.value;rebuildPX('${def.id}');document.getElementById('vpcnt${def.id}').textContent=this.value">
      <span class="pval" id="vpcnt${def.id}">${def.count}</span></td>
    <td><input class="pslider" type="range" min="0.05" max="4" step="0.05" value="${def.spd}"
      oninput="getPX('${def.id}').spd=+this.value;document.getElementById('vpspd${def.id}').textContent=(+this.value).toFixed(2)">
      <span class="pval" id="vpspd${def.id}">${def.spd.toFixed(2)}</span></td>
    <td><input class="pslider" type="range" min="0.01" max="0.4" step="0.01" value="${def.size}"
      oninput="getPX('${def.id}').size=+this.value;rebuildPX('${def.id}');document.getElementById('vpsize${def.id}').textContent=(+this.value).toFixed(2)">
      <span class="pval" id="vpsize${def.id}">${def.size.toFixed(2)}</span></td>
    <td><input class="pslider" type="range" min="1" max="24" step="0.5" value="${def.spread}"
      oninput="getPX('${def.id}').spread=+this.value;rebuildPX('${def.id}');document.getElementById('vpspread${def.id}').textContent=(+this.value).toFixed(1)">
      <span class="pval" id="vpspread${def.id}">${def.spread.toFixed(1)}</span></td>
    <td><input class="pslider" type="range" min="0.01" max="1" step="0.01" value="${def.bright}"
      oninput="getPX('${def.id}').bright=+this.value;document.getElementById('vpbright${def.id}').textContent=(+this.value).toFixed(2)">
      <span class="pval" id="vpbright${def.id}">${def.bright.toFixed(2)}</span></td>
    <td colspan="3"></td>
  `;
  pxtbody.appendChild(tr);
});

function getPX(id){return PX_DEFS.find(d=>d.id===id);}
function togPX(id){
  const d=getPX(id);
  d.on=!d.on;
  const btn=document.getElementById('pxon'+id);
  btn.classList.toggle('on',d.on);
  btn.textContent=d.on?'ON':'OFF';
  if(d.on) rebuildPX(id);
  else if(pxMeshes[id]){scene.remove(pxMeshes[id]);pxMeshes[id]=null;}
}

// ===== パーティクルスポーン関数（種類別） =====
function spawnOne(def){
  const s=def.spread;
  const keys=KEYS;
  const hue=LP[keys[Math.floor(Math.random()*keys.length)]].hue;
  const base={life:0,maxLife:80+Math.random()*160,hue,x:0,y:0,z:0,vx:0,vy:0,vz:0,angle:0,radius:0,orbitSpd:0};

  if(def.id==='FLURRY'){
    base.x=(Math.random()-0.5)*s; base.y=(Math.random()-0.5)*s*0.5-2; base.z=(Math.random()-0.5)*s*0.3;
    const sp=0.01+Math.random()*0.025; const ag=Math.random()*Math.PI*2;
    base.vx=Math.cos(ag)*sp*0.25+(Math.random()-0.5)*0.008;
    base.vy=sp*(0.4+Math.random()*0.6);
    base.vz=(Math.random()-0.5)*sp*0.15;
    base.twistX=(Math.random()-0.5)*0.002; base.twistZ=(Math.random()-0.5)*0.002;
  } else if(def.id==='SPARKS'){
    base.x=(Math.random()-0.5)*s*0.3; base.y=(Math.random()-0.5)*3; base.z=(Math.random()-0.5)*4;
    const sp=0.04+Math.random()*0.08; const ag=Math.random()*Math.PI*2; const el=(Math.random()-0.5)*Math.PI;
    base.vx=Math.cos(ag)*Math.cos(el)*sp; base.vy=Math.sin(el)*sp; base.vz=Math.sin(ag)*Math.cos(el)*sp;
    base.gravity=-0.0008; base.maxLife=30+Math.random()*60;
  } else if(def.id==='RAIN'){
    base.x=(Math.random()-0.5)*s; base.y=8+Math.random()*4; base.z=(Math.random()-0.5)*s*0.4;
    base.vx=(Math.random()-0.5)*0.005; base.vy=-(0.05+Math.random()*0.08); base.vz=0;
    base.maxLife=60+Math.random()*80;
  } else if(def.id==='ORBIT'){
    base.radius=1+Math.random()*s*0.4;
    base.angle=Math.random()*Math.PI*2;
    base.y=(Math.random()-0.5)*s*0.4;
    base.orbitSpd=(0.02+Math.random()*0.04)*(Math.random()<0.5?1:-1);
    base.vy=(Math.random()-0.5)*0.008;
    base.x=Math.cos(base.angle)*base.radius; base.z=Math.sin(base.angle)*base.radius;
    base.maxLife=100+Math.random()*200;
  } else if(def.id==='BURST'){
    base.x=(Math.random()-0.5)*2; base.y=(Math.random()-0.5)*2; base.z=(Math.random()-0.5)*2;
    const sp=0.02+Math.random()*0.06; const ag=Math.random()*Math.PI*2; const el=(Math.random()-0.5)*Math.PI;
    base.vx=Math.cos(ag)*Math.cos(el)*sp; base.vy=Math.sin(el)*sp*0.5; base.vz=Math.sin(ag)*Math.cos(el)*sp;
    base.decay=0.97+Math.random()*0.02; base.maxLife=40+Math.random()*80;
  } else if(def.id==='DRIFT'){
    base.x=(Math.random()-0.5)*s; base.y=(Math.random()-0.5)*s*0.5; base.z=(Math.random()-0.5)*s*0.4;
    base.vx=(Math.random()-0.5)*0.015; base.vy=(Math.random()-0.5)*0.004; base.vz=(Math.random()-0.5)*0.006;
    base.waveA=Math.random()*0.003; base.waveF=0.02+Math.random()*0.04;
    base.maxLife=120+Math.random()*200;
  }
  return base;
}

function rebuildPX(id){
  if(pxMeshes[id]){scene.remove(pxMeshes[id]);pxMeshes[id]=null;}
  const def=getPX(id);
  if(!def.on) return;
  const n=def.count;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3);
  const col=new Float32Array(n*3);
  pxData[id]=[];
  for(let i=0;i<n;i++){
    // ライフをランダムにずらして最初から自然に見せる
    const p=spawnOne(def);
    p.life=Math.floor(Math.random()*p.maxLife);
    pxData[id].push(p);
    pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;
    const c=new THREE.Color().setHSL(p.hue/360,0.7,0.75);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:def.size,vertexColors:true,transparent:true,opacity:def.bright,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  pxMeshes[id]=new THREE.Points(geo,mat);
  scene.add(pxMeshes[id]);
}

function updatePX(id){
  const mesh=pxMeshes[id]; if(!mesh) return;
  const def=getPX(id);
  const data=pxData[id]; if(!data) return;
  mesh.material.opacity=def.bright;
  mesh.material.size=def.size;
  const pos=mesh.geometry.attributes.position.array;
  const col=mesh.geometry.attributes.color.array;
  data.forEach((p,i)=>{
    p.life++;
    if(def.id==='FLURRY'){
      p.vx+=p.twistX+Math.sin(p.life*0.05)*0.0008;
      p.vz+=p.twistZ+Math.cos(p.life*0.07)*0.0006;
      p.vy*=0.999;
      p.x+=p.vx*def.spd*pxSpeedMult; p.y+=p.vy*def.spd*pxSpeedMult; p.z+=p.vz*def.spd*pxSpeedMult;
    } else if(def.id==='SPARKS'){
      p.vy+=p.gravity||0;
      p.x+=p.vx*def.spd*pxSpeedMult; p.y+=p.vy*def.spd*pxSpeedMult; p.z+=p.vz*def.spd*pxSpeedMult;
    } else if(def.id==='RAIN'){
      p.x+=p.vx*def.spd*pxSpeedMult; p.y+=p.vy*def.spd*pxSpeedMult; p.z+=p.vz*def.spd*pxSpeedMult;
    } else if(def.id==='ORBIT'){
      p.angle+=p.orbitSpd*def.spd*pxSpeedMult;
      p.y+=p.vy*def.spd*pxSpeedMult;
      p.x=Math.cos(p.angle)*p.radius; p.z=Math.sin(p.angle)*p.radius;
    } else if(def.id==='BURST'){
      p.vx*=(p.decay||0.98); p.vy*=(p.decay||0.98); p.vz*=(p.decay||0.98);
      p.x+=p.vx*def.spd*pxSpeedMult; p.y+=p.vy*def.spd*pxSpeedMult; p.z+=p.vz*def.spd*pxSpeedMult;
    } else if(def.id==='DRIFT'){
      p.vx+=Math.sin(p.life*(p.waveF||0.03))*p.waveA;
      p.x+=p.vx*def.spd*pxSpeedMult; p.y+=p.vy*def.spd*pxSpeedMult; p.z+=p.vz*def.spd*pxSpeedMult;
    }
    // リスポーン判定
    const dead=p.life>p.maxLife||p.y>15||p.y<-12||Math.abs(p.x)>20||Math.abs(p.z)>20;
    if(dead){ const np=spawnOne(def); Object.assign(p,np); }
    pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
    const lr=p.life/p.maxLife;
    const fade=lr<0.12?lr/0.12:lr>0.75?(1-lr)/0.25:1;
    const c=new THREE.Color().setHSL(p.hue/360,0.65,0.55+fade*0.25);
    col[i*3]=c.r*fade; col[i*3+1]=c.g*fade; col[i*3+2]=c.b*fade;
  });
  mesh.geometry.attributes.position.needsUpdate=true;
  mesh.geometry.attributes.color.needsUpdate=true;
}

// ===== ライト構築 =====
const lightGroups={};
function makeBeam(def,hue,br){
  const pivot=new THREE.Group();
  const beamLen=def.beamLen;const isUp=def.upward||false;const isFwd=def.forward||false;
  const rTop=isFwd?0.01:(isUp?br:0.01);const rBot=isFwd?br:(isUp?0.01:br);
  const geo=new THREE.CylinderGeometry(rTop,rBot,beamLen,20,10,true);
  const posArr=geo.attributes.position;const cols=new Float32Array(posArr.count*3);const col=new THREE.Color();
  for(let i=0;i<posArr.count;i++){
    const yy=posArr.getY(i);
    const t=isUp?Math.max(0,Math.min(1,(-yy+beamLen/2)/beamLen)):Math.max(0,Math.min(1,(yy+beamLen/2)/beamLen));
    col.setHSL(hue/360,t>0.7?Math.max(0,1-(t-0.7)*3):0.88,Math.min(0.82,0.04+t*0.75));
    cols[i*3]=col.r;cols[i*3+1]=col.g;cols[i*3+2]=col.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
  const cone=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.72,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  if(isFwd){cone.rotation.x=-Math.PI/2;cone.position.z=beamLen/2;}else{cone.position.y=isUp?beamLen/2:-beamLen/2;}
  pivot.add(cone);
  const glowY=isUp?beamLen:-beamLen;const glowZ=isFwd?beamLen:0;
  [[0.1,0.99],[0.4,0.93],[1.1,0.82],[2.3,0.70]].forEach(([r,l])=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,12),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(hue/360,0.45,l),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
    isFwd?m.position.z=glowZ:m.position.y=glowY;pivot.add(m);
  });
  pivot.add(new THREE.Mesh(new THREE.SphereGeometry(0.075,8,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false})));
  pivot.userData={smoothFP:0};return pivot;
}
function makeGroup(k){
  const def=LIGHT_DEFS[k];const p=LP[k];
  // beamLenをLPのlenで上書き
  const defWithLen={...def, beamLen:p.len||def.beamLen};
  const group=new THREE.Group();const n=def.count;const beams=[];
  for(let i=0;i<n;i++){
    const beam=makeBeam(defWithLen,p.hue,p.br);
    const xOff=n>1?(i/(n-1)-0.5)*defWithLen.spread:0;
    if(defWithLen.sideRight||defWithLen.sideLeft){beam.position.y=xOff;}else if(def.sweepAxes==='yz'){beam.position.z=xOff;}else{beam.position.x=xOff;}
    beam.rotation.set(def.initRot[0],def.initRot[1],def.initRot[2]);
    beam.userData.phaseOffset=(i/(n||1))*Math.PI*2;beam.userData.smoothFP=0;beams.push(beam);group.add(beam);
  }
  group.position.set(...defWithLen.pos);group.userData={beams,def:defWithLen,phase:0,blinkPhase:0};return group;
}
function rebuildLight(k){
  const ph=lightGroups[k]?lightGroups[k].userData.phase:Math.random()*Math.PI*2;
  const bp=lightGroups[k]?lightGroups[k].userData.blinkPhase:0;
  if(lightGroups[k])scene.remove(lightGroups[k]);
  const g=makeGroup(k);g.userData.phase=ph;g.userData.blinkPhase=bp;scene.add(g);lightGroups[k]=g;
}

function applyFlare(beam,rawFP,bright,blinkVal){
  const thr=0.70;const sharpFP=rawFP>thr?Math.pow((rawFP-thr)/(1-thr),1.6):0;
  const prev=beam.userData.smoothFP||0;beam.userData.smoothFP=prev+(sharpFP-prev)*(sharpFP>prev?0.28:0.07);
  const fp=beam.userData.smoothFP;
  // blinkVal: 0〜1のフェードイン/アウト値をそのままopacityに掛ける
  const finalOp=(0.15+fp*0.8)*bright*blinkVal;
  beam.children[0].material.opacity=Math.min(0.95,Math.max(0,finalOp));
  [1,2,3,4].forEach(ci=>{const g=beam.children[ci];if(!g?.material)return;g.material.opacity=0;g.scale.setScalar(1);});
  return fp;
}

// ===== AUDIO ENGINE =====
let audioCtx=null, analyser=null, audioSrc=null, audioEl=null;
let freqData=null;
let bassVal=0, midVal=0, highVal=0; // 0〜1 スムーズ値

// VUバー生成（16本）
const vuCont=document.getElementById('vubars');
const VU_N=16;
const vuEls=[];
for(let i=0;i<VU_N;i++){
  const b=document.createElement('div');
  b.className='vubar';
  vuCont.appendChild(b);
  vuEls.push(b);
}
// 色：低音=赤〜橙、中音=緑、高音=青
const vuColors=['#ff4422','#ff5522','#ff6622','#ff8822','#ffaa22','#ffcc22','#ddee22','#aaee33','#66ee55','#33dd88','#22ccaa','#22aacc','#2288ee','#4466ff','#6644ff','#aa33ff'];

function loadAudioFile(file){
  if(!file) return;
  if(audioEl){ audioEl.pause(); audioEl.src=''; }
  if(audioSrc){ audioSrc.disconnect(); }

  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();

  analyser=audioCtx.createAnalyser();
  analyser.fftSize=1024;
  analyser.smoothingTimeConstant=0.8;
  freqData=new Uint8Array(analyser.frequencyBinCount);
  analyser.connect(audioCtx.destination);

  audioEl=new Audio();
  audioEl.src=URL.createObjectURL(file);
  audioEl.crossOrigin='anonymous';
  audioSrc=audioCtx.createMediaElementSource(audioEl);
  audioSrc.connect(analyser);

  audioEl.addEventListener('loadedmetadata',()=>{
    document.getElementById('seekbar').disabled=false;
    document.getElementById('bplay').disabled=false;
    document.getElementById('trackname').textContent=file.name.replace(/\.[^.]+$/,'');
    document.getElementById('dropzone').classList.add('loaded');
    document.getElementById('dropzone').textContent='✓ '+file.name.substring(0,20);
    updateTimecode();
  });
  audioEl.addEventListener('timeupdate',updateTimecode);
  audioEl.addEventListener('ended',()=>{
    document.getElementById('bplay').textContent='PLAY';
    document.getElementById('bplay').classList.remove('on');
  });
}

function togglePlay(){
  if(!audioEl) return;
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  if(audioEl.paused){
    audioEl.play();
    document.getElementById('bplay').textContent='PAUSE';
    document.getElementById('bplay').classList.add('on');
  } else {
    audioEl.pause();
    document.getElementById('bplay').textContent='PLAY';
    document.getElementById('bplay').classList.remove('on');
  }
}

function setVolume(val){
  if(audioEl) audioEl.volume=parseFloat(val);
}

function seekAudio(val){
  if(!audioEl||!audioEl.duration) return;
  audioEl.currentTime=audioEl.duration*(val/100);
}

function updateTimecode(){
  if(!audioEl) return;
  const cur=audioEl.currentTime||0;
  const dur=audioEl.duration||0;
  const fmt=s=>Math.floor(s/60)+':'+(Math.floor(s%60)+'').padStart(2,'0');
  document.getElementById('timecode').textContent=fmt(cur)+' / '+fmt(dur);
  if(dur>0) document.getElementById('seekbar').value=(cur/dur)*100;
}

function updateAudio(){
  if(!analyser||!freqData) return;
  analyser.getByteFrequencyData(freqData);
  const bin=analyser.frequencyBinCount;

  // 周波数帯域分割（44100Hz想定）
  // 低音: 0〜200Hz → bin 0〜4
  // 中音: 200〜2000Hz → bin 4〜46
  // 高音: 2000〜8000Hz → bin 46〜185
  const avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=freqData[i];return s/((b-a)*255);};
  const rawBass=avg(0,5);
  const rawMid=avg(5,50);
  const rawHigh=avg(50,180);

  // スムージング
  // ゆったり追従（低音のみ使用）
  const sUp=0.04, sDn=0.02;
  bassVal+=(rawBass-bassVal)*(rawBass>bassVal?sUp:sDn);
  midVal +=(rawMid -midVal )*(rawMid >midVal ?sUp:sDn);
  highVal+=(rawHigh-highVal)*(rawHigh>highVal?sUp:sDn);

  // VUバー更新（16分割）
  const step=Math.floor(bin/VU_N);
  vuEls.forEach((el,i)=>{
    const v=avg(i*step,(i+1)*step);
    el.style.height=Math.max(1,v*18)+'px';
    el.style.background=vuColors[i];
    el.style.opacity=0.3+v*0.7;
  });
}
// ===== AUDIO ENGINE END =====

// ===== BROADCAST CHANNEL (送信) =====
const bc=new BroadcastChannel('phisualaizer_channel');
let bcTick=0;
function sendState(){
  bc.postMessage({
    type:'state',
    LP: Object.fromEntries(KEYS.map(k=>[k,{...LP[k]}])),
    lOn:{...lOn},
    slow,stop,
    PX: PX_DEFS.map(d=>({...d})),
    CAM:{...CAM},
  });
}

function animate(){
  requestAnimationFrame(animate);
  KEYS.forEach(k=>updateAuto(k));
  // 4フレームに1回送信（60fps→15fps相当）
  bcTick++;
  if(bcTick%4===0) sendState();
  let maxFP=0;
  Object.entries(lightGroups).forEach(([k,grp])=>{
    if(!lOn[k]){grp.visible=false;return;}
    grp.visible=true;
    const p=LP[k];
    const syncKey=p.sync&&p.sync!=='NONE'?p.sync:null;
    if(!stop){
      if(syncKey&&lightGroups[syncKey]){
        const targetPh=lightGroups[syncKey].userData.phase;
        const diff=targetPh-grp.userData.phase;
        grp.userData.phase+=diff*0.05+p.spd*(slow?0.1:1)*0.3;
      } else {
        grp.userData.phase+=p.spd*(slow?0.1:1);
      }
      grp.userData.blinkPhase+=0.016;
    }
    const ph=grp.userData.phase;const bp=grp.userData.blinkPhase;const def=grp.userData.def;const sa=def.sweepAxes;
    // blink=0: 常時点灯(1.0), blink>0: 0〜1のフェードイン/アウト
    const blinkVal=p.blink>0?Math.max(0.0,(Math.sin(bp*p.blink*2.0)+1.0)*0.5):1.0;
    grp.userData.beams.forEach(beam=>{
      const bph=ph+beam.userData.phaseOffset*(1-p.syncGroup);
      if(def.sideRight){beam.rotation.z=Math.PI/2+Math.sin(bph)*0.9;beam.rotation.x=Math.cos(bph*0.8)*0.7;}
      else if(def.sideLeft){beam.rotation.z=-Math.PI/2+Math.sin(bph)*0.9;beam.rotation.x=Math.cos(bph*0.8)*0.7;}
      else if(def.forward){beam.rotation.y=Math.sin(bph)*1.0*(beam.position.x<0?1:-1);beam.rotation.x=Math.cos(bph*0.7)*0.5;}
      else if(sa==='xz'){beam.rotation.x=def.initRot[0]+Math.sin(bph)*1.2;beam.rotation.z=def.initRot[2]+Math.cos(bph*0.8)*1.2-1.2;}
      else if(sa==='xy'){beam.rotation.x=def.initRot[0]+Math.sin(bph)*1.0;beam.rotation.y=def.initRot[1]+Math.cos(bph*0.75)*1.0-1.0;}
      else if(sa==='yz'){beam.rotation.y=def.initRot[1]+Math.sin(bph)*1.0;beam.rotation.z=def.initRot[2]+Math.cos(bph*0.8)*0.8;}
      const worldPos=new THREE.Vector3();beam.getWorldPosition(worldPos);
      const bv=def.sideRight?new THREE.Vector3(-1,0,0):def.sideLeft?new THREE.Vector3(1,0,0):def.forward?new THREE.Vector3(0,0,1):def.upward?new THREE.Vector3(0,1,0):new THREE.Vector3(0,-1,0);
      bv.applyEuler(beam.rotation);
      const toCam=camera.position.clone().sub(worldPos).normalize();
      const rawFP=Math.max(0,bv.dot(toCam));
      const fp=applyFlare(beam,rawFP,p.bright,blinkVal);
      if(fp>maxFP)maxFP=fp;
    });
  });
  // オーディオ解析
  updateAudio();

  // 音連動：bass→パーティクルBRIGHT倍増・mid→SPEED倍増・high→ライトBRIGHT
  const audioActive=analyser&&audioEl&&!audioEl.paused;
  if(audioActive){
    PX_DEFS.forEach(d=>{
      if(!d.on) return;
      const mesh=pxMeshes[d.id]; if(!mesh) return;
      // 低音でパーティクルが明るく弾ける
      mesh.material.opacity=Math.min(1, d.bright*(1+bassVal*2.5));
      // 中音でスピードが上がる（視覚的にonly、pxDataのvには影響させない）
      mesh.material.size=d.size*(1+highVal*1.5);
    });
    // ライト音連動なし（後で実装予定）
  }

  // パーティクル更新
  PX_DEFS.forEach(d=>{ if(d.on&&!stop) updatePX(d.id); });
  if(maxFP>0.55)renderer.setClearColor(new THREE.Color(0x000a1b).lerp(new THREE.Color(0x0c1e3a),(maxFP-0.55)*0.45),1);
  else renderer.setClearColor(0x000a1b,1);
  renderer.render(scene,camera);
}
animate();
</script>
